<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ditto Assist</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="icon" type="image/png" href="/assets/favicon-180.png" />
    <link rel="apple-touch-icon" href="/assets/favicon-180.png" />
    <!-- Without this, Chrome/Edge's "Install app" / pin-to-taskbar flow has
         no maskable icon to draw from, so it falls back to synthesizing one
         from the favicon and pads it defensively to avoid the OS's rounded-
         square/circle mask clipping content it doesn't know is safe —
         that's what was making the taskbar icon look smaller than properly
         manifest-declared apps (Gemini, internal CRM) sitting next to it. -->
    <link rel="manifest" href="/assets/manifest.webmanifest" />
    <meta name="theme-color" content="#03101A" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap');
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
